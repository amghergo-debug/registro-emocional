<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080909">
  <title>Registro emocional | Lic. Marcela Ghergo</title>
  <style>
    html,body{margin:0;min-height:100%;background:#080909;color:#f2eadc;font-family:system-ui,-apple-system,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:430px}h1{font-family:Georgia,serif;font-weight:500;font-size:32px;margin:0 0 8px}
    p{color:#a79e91;line-height:1.5}.dot{width:8px;height:8px;border-radius:50%;background:#c7a365;margin:20px auto;animation:pulse 1.3s infinite}
    @keyframes pulse{50%{opacity:.35}}.err{display:none;margin-top:18px;padding:14px;border:1px solid #673c39;border-radius:12px;background:#211514;color:#e2b0ab;font-size:14px}
  </style>
</head>
<body>
  <main class="loading"><div class="box"><h1>Registro emocional</h1><p>Lic. Marcela Ghergo</p><div class="dot"></div><div id="err" class="err">No pudimos iniciar la plataforma. Recargá la página en unos segundos.</div></div></main>
  <script>
  (async()=>{
    const SOURCE='https://ftvnwjwttsfcosbbceun.supabase.co/functions/v1/registro-emocional-source';
    const showError=(e)=>{console.error(e);const d=document.querySelector('.dot');if(d)d.style.display='none';const x=document.getElementById('err');if(x){x.style.display='block';x.textContent='No pudimos iniciar la plataforma. Recargá la página. Si continúa, avisale a Marcela.'}};
    const loadExternal=src=>new Promise((resolve,reject)=>{
      const candidates=[src];
      if(src.includes('vendor-assets?lib=supabase')){
        candidates.push('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
        candidates.push('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js');
      }
      let i=0;
      const attempt=()=>{
        if(i>=candidates.length)return reject(new Error('No se pudo cargar Supabase JS'));
        const s=document.createElement('script');
        s.src=candidates[i++];
        s.onload=resolve;
        s.onerror=()=>{s.remove();attempt()};
        document.head.appendChild(s);
      };
      attempt();
    });
    try{
      const r=await fetch(SOURCE,{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const html=await r.text();
      if(!html.toLowerCase().includes('<!doctype html>'))throw new Error('Contenido inválido');
      const parsed=new DOMParser().parseFromString(html,'text/html');
      const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.src,code:s.textContent||''}));
      parsed.querySelectorAll('script').forEach(s=>s.remove());
      document.title=parsed.title||document.title;
      document.head.innerHTML=parsed.head.innerHTML;
      document.body.innerHTML=parsed.body.innerHTML;
      for(const item of scripts){
        if(item.src){
          await loadExternal(item.src);
        }else if(item.code.trim()){
          let code=item.code;
          code=code.replace("const URL='https://ftvnwjwttsfcosbbceun.supabase.co';","const SUPABASE_URL='https://ftvnwjwttsfcosbbceun.supabase.co';")
                   .replaceAll('createClient(URL,KEY)','createClient(SUPABASE_URL,KEY)')
                   .replaceAll("fetch(URL+'/functions/v1/","fetch(SUPABASE_URL+'/functions/v1/")
                   .replaceAll('URL.createObjectURL','window.URL.createObjectURL')
                   .replaceAll('URL.revokeObjectURL','window.URL.revokeObjectURL');
          const s=document.createElement('script');
          s.textContent=code;
          document.body.appendChild(s);
        }
      }
    }catch(e){showError(e)}
  })();
  </script>
</body>
</html>
